name: WordPress আমদানি / ছবি স্থানান্তর

on:
  workflow_dispatch:
    inputs:
      task:
        description: "কী করবেন?"
        type: choice
        options:
          - "ছবি স্থানান্তর (পুরোনো সাইটের ছবি রিপোতে আনুন)"
          - "নতুন লেখা আমদানি (আগেরগুলো অপরিবর্তিত)"
          - "সব লেখা আবার আমদানি (সম্পাদনা মুছে যাবে!)"
        default: "ছবি স্থানান্তর (পুরোনো সাইটের ছবি রিপোতে আনুন)"
      site:
        description: "WordPress সাইটের ঠিকানা"
        default: "https://thekeyari.com"

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: চালানো
        env:
          TASK: ${{ inputs.task }}
          SITE: ${{ inputs.site }}
        run: |
          HOST=$(python -c "import os,urllib.parse;print(urllib.parse.urlparse(os.environ['SITE']).netloc.replace('www.',''))")
          case "$TASK" in
            ছবি*)  python tools/localize_images.py --host "$HOST" ;;
            নতুন*) python tools/import_wordpress.py "$SITE" --keep-existing && python tools/localize_images.py --host "$HOST" ;;
            সব*)   python tools/import_wordpress.py "$SITE" && python tools/localize_images.py --host "$HOST" ;;
          esac
      - name: কমিট ও পুশ
        run: |
          git config user.name "keyari-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content static
          if git diff --cached --quiet; then echo "পরিবর্তন নেই"; exit 0; fi
          git commit -m "WordPress: ${{ inputs.task }}"
          git push
      - name: সাইট আবার তৈরি
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}" || true
